<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOCK FIELD — 自由につくろう</title><style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=DM+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#a9d7e8;color:#fff;font-family:'DM Sans','DotGothic16',sans-serif;overflow:hidden}canvas{display:block}button{font:inherit;cursor:pointer}#game{position:fixed;inset:0}.top{position:absolute;top:0;left:0;right:0;padding:25px 30px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(#172e3870,transparent)}.brand{display:flex;gap:12px;align-items:center;text-shadow:0 2px 5px #243a3a80}.logo{width:39px;height:39px;background:#79ad4d;border:3px solid #fff;box-shadow:inset 0 -12px #82623d,0 3px #263c36}.brand strong{display:block;font-size:20px;letter-spacing:.13em;line-height:1}.brand small{font-size:10px;letter-spacing:.18em}.topright{display:flex;gap:8px;pointer-events:auto}.pill,.tool{background:#1d3030b8;color:#fff;border:1px solid #ffffff50;border-radius:7px;padding:10px 14px;font-size:12px;backdrop-filter:blur(8px)}.tool:hover{background:#355047}.status{font-family:'DotGothic16';}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;line-height:1;text-shadow:0 1px 3px #222;pointer-events:none}.bottom{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}.hint{font-family:'DotGothic16';font-size:12px;text-shadow:0 2px 4px #000;white-space:nowrap}.hotbar{display:flex;gap:5px;padding:6px;background:#1a2826c9;border:1px solid #ffffff60;border-radius:9px;box-shadow:0 6px 25px #24332955}.slot{width:58px;height:58px;border:2px solid #ffffff35;background:#ffffff12;border-radius:4px;color:#fff;position:relative;display:grid;place-items:center}.slot.active{border-color:#fff;background:#ffffff40;box-shadow:0 0 0 2px #263d34}.slot span{position:absolute;left:5px;top:3px;font-size:10px}.cube{width:27px;height:27px;transform:rotate(-3deg);border:2px solid #0003;box-shadow:inset -6px -6px #0002,inset 4px 4px #fff3}.label{font-family:'DotGothic16';font-size:13px;text-shadow:0 2px 4px #000}.overlay{position:absolute;inset:0;background:linear-gradient(90deg,#142a2bd9 0%,#1a32308c 45%,#1e393022 100%);display:flex;align-items:center;padding:7vw}.panel{max-width:490px}.eyebrow{font-size:12px;letter-spacing:.25em;color:#c3eaa3;font-weight:700}.panel h1{font-size:clamp(48px,7vw,92px);line-height:.94;letter-spacing:-.04em;margin:20px 0}.panel h1 span{color:#b9e88b}.panel p{font-family:'DotGothic16';line-height:1.9;font-size:15px;color:#edf5e8}.start{margin-top:22px;background:#d4f28e;color:#263c25;border:0;border-bottom:5px solid #729c4a;border-radius:5px;padding:16px 29px;font-weight:700;font-size:16px}.start:hover{background:#e1ffa2}.guide{display:flex;gap:24px;margin-top:38px;font-size:12px;color:#d8e9d4}.guide b{display:block;color:white;margin-bottom:6px;font-size:14px}.hidden{display:none!important}.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#20352fea;padding:10px 18px;border-radius:5px;font-size:13px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:650px){.top{padding:15px}.brand small,.status{display:none}.topright{gap:4px}.tool{padding:9px;font-size:11px}.slot{width:43px;height:46px}.cube{width:22px;height:22px}.hint{font-size:10px}.guide{gap:12px;flex-wrap:wrap}.panel h1{font-size:52px}.overlay{padding:25px}}
</style></head><body><div id="game"></div><div class="top"><div class="brand"><div class="logo"></div><div><strong>BLOCK FIELD</strong><small>YOUR WORLD, YOUR RULES</small></div></div><div class="topright"><div class="pill status">● クリエイティブ</div><button class="tool" id="save">保存</button><button class="tool" id="reset">新しい世界</button><button class="tool" id="help">操作方法</button></div></div><div class="cross">+</div><div class="toast" id="toast"></div><div class="bottom"><div class="label" id="label">草ブロック</div><div class="hotbar" id="hotbar"></div><div class="hint">W A S D 移動　 /　マウス 視点　 /　左クリック こわす　 /　右クリック おく</div></div><div class="overlay" id="overlay"><div class="panel"><div class="eyebrow">A LITTLE WORLD OF YOUR OWN</div><h1>BUILD<br><span>YOUR WORLD.</span></h1><p>掘って、積んで、思いのままに。<br>あなただけの小さな世界をつくろう。</p><button class="start" id="start">世界に入る</button><div class="guide"><div><b>W A S D</b>移動する</div><div><b>マウス</b>見回す</div><div><b>クリック</b>こわす / おく</div><div><b>SPACE</b>ジャンプ</div></div><p style="font-size:11px;opacity:.75">パソコンのキーボードとマウスで遊べます。ESCで一時停止。</p></div></div><script type="module" src="./game.js"></script></body></html>

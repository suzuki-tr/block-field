<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BLOCK FIELD — 自由につくろう</title><style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=DM+Sans:wght@400;600;700&display=swap');

-shadow:0 2px 4px #000}.overlay{position:absolute;inset:0;background:linear-gradient(90deg,#142a2bd9 0%,#1a32308c 45%,#1e393022 100%);display:flex;align-items:center;padding:7vw}.panel{max-width:490px}.eyebrow{font-size:12px;letter-spacing:.25em;color:#c3eaa3;font-weight:700}.panel h1{font-size:clamp(48px,7vw,92px);line-height:.94;letter-spacing:-.04em;margin:20px 0}.panel h1 span{color:#b9e88b}.panel p{font-family:'DotGothic16';line-height:1.9;font-size:15px;color:#edf5e8}.start{margin-top:22px;background:#d4f28e;color:#263c25;border:0;border-bottom:5px solid #729c4a;border-radius:5px;padding:16px 29px;font-weight:700;font-size:16px}.start:hover{background:#e1ffa2}.guide{display:flex;gap:24px;margin-top:38px;font-size:12px;color:#d8e9d4}.guide b{display:block;color:white;margin-bottom:6px;font-size:14px}.hidden{display:none!important}.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#20352fea;padding:10px 18px;border-radius:5px;font-size:13px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:650px){.top{padding:15px}.brand small,.status{display:none}.topright{gap:4px}.tool{padding:9px;font-size:11px}.slot{width:43px;height:46px}.cube{width:22px;height:22px}.hint{font-size:10px}.guide{gap:12px;flex-wrap:wrap}.panel h1{font-size:52px}.overlay{padding:25px}}

html,body,#game,canvas{touch-action:none;overscroll-behavior:none}button{-webkit-tap-highlight-color:transparent}.touch-controls{display:none;position:absolute;inset:0;pointer-events:none}.touch-controls.active{display:block}.touch-controls button,.joystick{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}.joystick{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(125px,calc(env(safe-area-inset-bottom) + 110px));width:126px;height:126px;border-radius:50%;background:#1b333777;border:2px solid #ffffff80}.stick{position:absolute;left:50%;top:50%;width:51px;height:51px;border-radius:50%;background:#f3fffbb0;border:2px solid white;transform:translate(-50%,-50%);pointer-events:none}.touch-actions{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(125px,calc(env(safe-area-inset-bottom) + 110px));display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:none}.touch-actions button{height:62px;border-radius:12px;background:#1c3439bb;border:1px solid #ffffffaa;color:white;font-size:14px;font-family:'DotGothic16';box-shadow:0 3px 8px #0003}.touch-actions button:active{background:#638c67}.touch-actions .jump{grid-column:1/3;height:50px}.touch-start{margin-left:8px;background:#eaf5d5}.touch-hint{display:none}.touch-mode .touch-hint{display:block}.touch-mode .desktop-hint{display:none}.touch-mode .bottom{bottom:max(15px,env(safe-area-inset-bottom))}.touch-mode .overlay{touch-action:auto}.touch-mode .topright{pointer-events:auto}@media(max-width:650px){.touch-controls .joystick{width:104px;height:104px;bottom:105px}.touch-actions{bottom:105px;grid-template-columns:repeat(2,57px);gap:5px}.touch-actions button{height:50px;font-size:12px}.touch-actions .jump{height:42px}.touch-mode .hint{font-size:10px}.touch-mode .hotbar{gap:2px;padding:4px}.touch-mode .slot{width:min(10vw,41px);height:42px}.touch-mode .bottom{gap:5px}.touch-mode .label{font-size:11px}.touch-mode .brand strong{font-size:15px}.touch-mode .logo{width:30px;height:30px}.touch-mode .tool{padding:7px;font-size:10px}.touch-mode .top{padding:10px}.touch-mode .panel h1{font-size:clamp(36px,10vw,52px);margin:10px 0}.touch-mode .guide{margin-top:15px}.touch-mode .panel p{font-size:12px;margin:8px 0}.touch-mode .start{margin-top:8px;padding:12px 16px}.touch-mode .overlay{overflow:auto;align-items:safe center}}

.multi-panel{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:center;background:#101f20d9;padding:16px;touch-action:auto}.multi-card{width:min(560px,100%);max-height:95vh;overflow:auto;background:#203b39;color:white;border:1px solid #ffffff55;border-radius:12px;padding:22px;box-shadow:0 16px 60px #0008;font-size:14px;line-height:1.6}.multi-card header{display:flex;align-items:center;justify-content:space-between}.multi-card h2{margin:0;font-size:22px}.multi-card p{margin:10px 0}.multi-card button{color:#17362b;background:#d4f28e;border:0;border-radius:5px;padding:10px 14px;font-weight:700}.multi-card .multi-x{font-size:24px;padding:0 10px;background:transparent;color:white}.multi-card .multi-actions{display:flex;gap:8px;flex-wrap:wrap}.multi-card label{display:block;margin:12px 0 3px}.multi-card textarea{width:100%;height:74px;resize:vertical;padding:8px;border:1px solid #bed2bf;border-radius:5px;background:#f5faf2;color:#192c23;font-size:14px;touch-action:auto;user-select:text}.multi-card #multiStatus{padding:8px 10px;margin:12px 0;background:#0f282680;border-radius:5px}.multi-card .multi-note{font-size:12px;color:#d4e7d6}.multi-card button:disabled{opacity:.5}

.mob-hud{position:absolute;left:30px;top:80px;padding:7px 12px;background:#243b36c9;border:1px solid #ffffff70;border-radius:6px;color:#ffb3aa;font-size:16px;font-weight:700;pointer-events:none;text-shadow:0 1px 3px #111}.mob-toggle{white-space:nowrap}@media(max-width:650px){.mob-hud{left:10px;top:53px;font-size:13px}.topright{flex-wrap:wrap;justify-content:flex-end;max-width:72%}.topright .tool{padding:7px;font-size:10px}}

.slot .count{position:absolute;right:3px;bottom:1px;min-width:15px;text-align:right;font-size:12px;color:white;text-shadow:0 1px 3px #000,1px 1px 2px #000}.slot.empty .cube{opacity:.4}

.craft-card{width:min(520px,100%)}.craft-card #craftStatus{margin:10px 0;padding:8px 10px;border-radius:5px;background:#0f282680}.craft-recipes{display:grid;gap:9px}.craft-recipe{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #ffffff35;border-radius:6px;background:#ffffff0d}.craft-recipe strong{font-size:16px}.craft-ingredients{margin-top:3px;color:#d5ead6;font-size:13px}.craft-recipe button{flex-shrink:0;min-width:70px}.craft-recipe button:disabled{opacity:.45}

.craft-shortcut{display:none;position:absolute;right:30px;bottom:130px;z-index:2}.in-world .craft-shortcut{display:block}.touch-mode .craft-shortcut{display:none}.touch-actions .jump,.touch-actions .craft-touch{grid-column:auto;height:50px}.equipment{display:grid;gap:6px;padding:10px;background:#ffffff12;border-radius:6px}.equipment-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.equipment-line button{padding:5px 8px;font-size:12px}.craft-card{max-height:min(92vh,740px)}@media(max-width:650px){.touch-actions .jump,.touch-actions .craft-touch{height:42px}.craft-shortcut{right:12px;bottom:100px}.craft-recipe{padding:8px}.craft-ingredients{font-size:12px}}
</style></head><body><div id="game"></div><div class="top"><div class="brand"><div class="logo"></div><div><strong>BLOCK FIELD</strong><small>YOUR WORLD, YOUR RULES</small></div></div><div class="topright"><div class="pill status">● クリエイティブ</div><button class="tool" id="save">保存</button><button class="tool" id="reset">新しい世界</button><button class="tool" id="help">操作方法</button></div></div><div class="cross">+</div><div class="toast" id="toast"></div><div class="bottom"><div class="label" id="label">草ブロック</div><div class="hotbar" id="hotbar"></div><div class="hint desktop-hint">W A S D 移動　 /　マウス 視点　 /　左クリック こわす　 /　右クリック おく</div><div class="hint touch-hint">画面をドラッグして見回す</div></div><div class="touch-controls" id="touchControls"><div class="joystick" id="joystick" aria-label="移動スティック"><div class="stick" id="stick"></div></div><div class="touch-actions"><button id="breakBlock">こわす</button><button id="placeBlock">おく</button><button class="jump" id="jump">ジャンプ</button></div></div><div class="overlay" id="overlay"><div class="panel"><div class="eyebrow">A LITTLE WORLD OF YOUR OWN</div><h1>BUILD<br><span>YOUR WORLD.</span></h1><p>掘って、積んで、思いのままに。<br>あなただけの小さな世界をつくろう。</p><button class="start" id="start">世界に入る</button><button class="start touch-start" id="touchStart">タッチであそぶ</button><div class="guide"><div><b>W A S D</b>移動する</div><div><b>マウス</b>見回す</div><div><b>クリック</b>こわす / おく</div><div><b>SPACE</b>ジャンプ</div></div><p style="font-size:11px;opacity:.75">タッチ操作は「タッチであそぶ」を選んでね。パソコンはESCで一時停止。</p></div></div><script type="module" src="./game.js"></script></body></html>
